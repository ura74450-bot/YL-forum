<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YL forum</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,Arial,sans-serif;
 background:#f4f6f8;
 color:#172033
}

button,input,textarea{font:inherit}

button{
 border:0;
 border-radius:10px;
 padding:11px 16px;
 background:#1769e0;
 color:white;
 font-weight:700;
 cursor:pointer
}

button:hover{filter:brightness(.95)}
button:disabled{opacity:.6;cursor:not-allowed}

.secondary{
 background:#eef1f5;
 color:#263247
}

header{
 background:white;
 border-bottom:1px solid #e4e8ee;
 position:sticky;
 top:0;
 z-index:20
}

.nav{
 max-width:1100px;
 margin:auto;
 padding:14px 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px
}

.logo{
 display:flex;
 align-items:center;
 gap:7px;
 font-weight:900;
 font-size:26px;
 letter-spacing:-1px
}

.y{color:#ed3030}
.l{color:#2474e8}

.forum{
 color:#172033;
 font-size:20px;
 font-weight:800;
 margin-left:2px
}

.nav-actions{
 display:flex;
 align-items:center;
 gap:9px
}

.user{
 font-size:14px;
 color:#667085;
 font-weight:700
}

main{
 max-width:850px;
 margin:0 auto;
 padding:36px 20px 70px
}

.hero{
 background:white;
 border:1px solid #e5e9ef;
 border-radius:18px;
 padding:28px;
 margin-bottom:22px
}

.hero h1{
 margin:0 0 8px;
 font-size:34px
}

.hero p{
 margin:0;
 color:#718096
}

.news{
 background:white;
 border:1px solid #e5e9ef;
 border-radius:18px;
 padding:24px;
 margin:16px 0;
 box-shadow:0 3px 12px rgba(20,35,60,.04)
}

.news h2{
 margin:0 0 8px;
 font-size:23px
}

.meta{
 color:#8791a3;
 font-size:13px;
 margin-bottom:17px
}

.body{
 line-height:1.7;
 font-size:16px;
 overflow-wrap:anywhere
}

.body img{
 display:block;
 max-width:100%;
 height:auto;
 border-radius:12px;
 margin:15px 0
}

.body a{
 color:#1769e0
}

.body blockquote{
 margin:12px 0;
 padding:10px 14px;
 border-left:4px solid #1769e0;
 background:#f4f7fb;
 color:#596579
}

.yl-badge{
 display:inline-block;
 background:#edf5ff;
 color:#1769e0;
 border-radius:999px;
 padding:4px 8px;
 font-size:11px;
 margin-left:6px
}

/* EDITOR */

.editor{
 display:none;
 background:white;
 border:1px solid #dfe5ec;
 border-radius:18px;
 padding:24px;
 margin-bottom:22px
}

.editor.show{display:block}

.editor h2{
 margin:0 0 4px
}

.editor-head{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:15px;
 margin-bottom:18px
}

.draft{
 font-size:12px;
 color:#23844d;
 background:#eaf8f0;
 border-radius:999px;
 padding:6px 10px
}

.editor-grid{
 display:grid;
 grid-template-columns:1.1fr .9fr;
 gap:20px
}

.toolbar{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-bottom:7px;
 padding:7px;
 background:#f7f8fa;
 border:1px solid #e1e6ed;
 border-radius:11px
}

.toolbar button{
 padding:8px 10px;
 font-size:13px;
 background:white;
 color:#263247;
 border:1px solid #dfe4eb
}

.toolbar button:hover{
 background:#edf4ff;
 color:#1769e0
}

input,textarea{
 width:100%;
 padding:13px 14px;
 border:1px solid #d7dde6;
 border-radius:10px;
 background:white;
 color:#172033;
 outline:none;
 margin:7px 0 12px
}

input:focus,textarea:focus{
 border-color:#1769e0;
 box-shadow:0 0 0 3px #1769e01a
}

textarea{
 min-height:190px;
 resize:vertical
}

.media-box{
 padding:13px;
 border:1px solid #e1e6ed;
 background:#fafbfc;
 border-radius:12px
}

.file-row{
 display:flex;
 gap:8px;
 align-items:center;
 flex-wrap:wrap;
 margin:7px 0 5px
}

.file-row input{
 margin:0;
 flex:1;
 min-width:180px
}

.hint{
 font-size:13px;
 color:#8993a3
}

.preview-label{
 font-size:11px;
 font-weight:800;
 color:#8a94a5;
 letter-spacing:.08em;
 margin:5px 0 8px
}

.preview-card{
 border:1px solid #e2e7ee;
 border-radius:15px;
 overflow:hidden;
 background:white
}

.preview-image{
 height:125px;
 background:#eef3f8;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#8b95a5;
 font-weight:800
}

.preview-inner{
 padding:15px
}

.preview-inner h2{
 font-size:19px;
 margin:0 0 7px
}
